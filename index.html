  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion:reduce){
    .hero-inner{animation:none;}
    html{scroll-behavior:auto;}
  }
